<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HKU Zhangjiang Campus · Seven Days</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b202b'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23e0b64a'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-group">
      <span class="chip day"><i class="lbl" data-zh="第">Day</i> <b id="hud-day">1</b><i class="lbl" data-zh=" / 7 天"> / 7</i></span>
      <span class="chip where" id="hud-scene">Campus</span>
      <span class="chip ap" id="hud-ap">AP ●●●</span>
    </div>
    <div class="hud-group">
      <span class="chip know"><i class="lbl" data-zh="知识">Knowledge</i> <b id="hud-know">0</b></span>
      <span class="chip mood"><i class="lbl" data-zh="心境">Mood</i> <b id="hud-mood">60</b></span>
      <span class="chip deck"><i class="lbl" data-zh="牌组">Deck</i> <b id="hud-deck">0</b></span>
      <span class="chip friend" id="hud-friend"></span>
      <button class="chip lang" id="btn-lang" type="button" title="Switch language / 切换语言">中文</button>
    </div>
  </header>

  <main id="stage">
    <div id="scene">
      <canvas id="game" width="768" height="480"></canvas>
      <div id="labels"></div>
      <div id="prompt" class="hidden">Press E to interact</div>
      <div id="toast" class="hidden"></div>
    </div>
    <aside id="side">
      <h3 data-zh="手记">Journal</h3>
      <ol id="log"></ol>
      <div class="side-deck">
        <h4><i class="lbl" data-zh="牌组">Deck</i> <span class="muted" data-zh="— 白天记下的笔记">— notes taken in daylight</span></h4>
        <ul id="deck"></ul>
      </div>
      <div class="side-foot">
        <button id="btn-char" class="btn small" data-zh="角色">Character</button>
        <button id="btn-endday" class="btn small" data-zh="结束白天 →">End Day →</button>
      </div>
    </aside>
  </main>

  <div id="modal-root" class="hidden">
    <div id="modal-bg" class="hidden" aria-hidden="true">
      <div class="bg-layer"></div>
      <div class="bg-layer"></div>
      <div class="bg-scrim"></div>
    </div>
    <div id="modal-backdrop"></div>
    <div id="modal" class="panel"></div>
  </div>

  <!-- Hit flash: a permanent overlay layer that only changes opacity. No DOM rebuild, so running animations keep going -->
  <div id="flash"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
